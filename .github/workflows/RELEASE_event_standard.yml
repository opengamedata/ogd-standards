name: Release Event Standard
on:
  release:
    types: created

env:
  SOURCE_PATH: events
  CUSTOM_GEOMETRY: margin=2cm
  OUTFILE_NAME: event-standard.pdf

jobs:
  generate_pdf:
    name: Generate Event Standard PDF
    if: startsWith(github.event.release.tag_name, 'events-')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build PDF
      uses: docker://pandoc/latex:3.10-ubuntu
      with:
        args: sh -c "cd ${{  env.SOURCE_PATH }} && pandoc *.md -V geometry:${{ env.CUSTOM_GEOMETRY }} -f markdown -t pdf -s -o ${{ env.OUTFILE_NAME }}"
        # cd ${{ env.SOURCE_PATH }}
        # pandoc *.md -V geometry:${{ env.CUSTOM_GEOMETRY }} -f markdown -t pdf -s -o ${{ env.OUTFILE_NAME }}
    # - name: Install GitHub CLI
    #   run: apt update && apt install gh
    - name: Attach PDF to release
      run: gh release upload $GITHUB_REF ${{ env.SOURCE_PATH }}/${{ env.OUTFILE_NAME }}
    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-standard.pdf
        path: ${{ env.SOURCE_PATH }}/${{ env.OUTFILE_NAME }}
