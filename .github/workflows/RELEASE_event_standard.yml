name: Release Event Standard
on:
  release:
    types: created

env:
  SOURCE_PATH: events
  CUSTOM_GEOMETRY: margin=2cm
  OUTFILE_NAME: event-standard.pdf

jobs:
  generate_pdf:
    runs-on: ubuntu-latest
    container: pandoc/latex:3.10-ubuntu
    steps:
    - uses: actions/checkout@v3
    - name: Build PDF
      run: |
        cd ${{ env.SOURCE_PATH }}
        pandoc *.md -V geometry:${{ env.CUSTOM_GEOMETRY }} -f markdown -t pdf -s -o ${{ env.OUTFILE_NAME }}
    - name: Attach PDF to release
      run: gh release upload $GITHUB_REF ${{ env.SOURCE_PATH }}/${{ env.OUTFILE_NAME }}
    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: event-standard.pdf
        path: ${{ env.SOURCE_PATH }}/${{ env.OUTFILE_NAME }}
